# ~/.config/foot/foot.ini
# Glass terminal. Colours and transparency live in colors.ini,
# which theme-sync.py rewrites whenever the wallpaper changes.

include=~/.config/foot/colors.ini

font=JetBrainsMono Nerd Font:size=14
pad=18x18
initial-window-size-chars=95x28

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=5000
