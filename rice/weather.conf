# ~/.config/rice/weather.conf
# Location for the weather module in the bar. Your location is never detected
# automatically: only what you type here is used.
#
# Use a city name (spaces are fine) or an airport code, for example:
#   LOCATION="London"
#   LOCATION="New York"
#   LOCATION="LHR"
# Leave it empty to hide the weather module.

LOCATION=""

# Units: "m" for Celsius, "u" for Fahrenheit
UNITS="m"
