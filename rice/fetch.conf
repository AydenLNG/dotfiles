# ~/.config/rice/fetch.conf: settings for fastfetch (used by rice/fetch.sh).
# Copied once by the installer; your edits are kept on reinstall.

# Chance (0-100) of showing a picture from ~/Pictures/Fetch instead of a text logo.
IMAGE_CHANCE=50

# Text logos to pick from at random. See all names with: fastfetch --list-logos
# Preview one with: fastfetch --logo NAME
LOGOS=(arch arch2 arch_small)

# Below this terminal width (in characters) the picture is skipped,
# because it would overlap the text. Text logos need less room.
MIN_COLS_IMAGE=100
MIN_COLS_LOGO=72
