# Generated by ~/.config/rice/theme-sync.py (overwritten on wallpaper change)
# Lock screen: blurred wallpaper, clock, date and a password box in your colours.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(14151e)
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(86aaec)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgb(86aaec)
    inner_color = rgba(14151ecc)
    font_color = rgb(c0caf5)
    check_color = rgb(c296eb)
    fail_color = rgb(dd6777)
    placeholder_text = password
    fade_on_empty = false
    rounding = 14
    position = 0, -60
    halign = center
    valign = center
}
