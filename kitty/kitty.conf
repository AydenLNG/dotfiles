# ~/.config/kitty/kitty.conf
# Glass terminal. Colours and transparency live in colors.conf,
# which theme-sync.py rewrites whenever the wallpaper changes.

include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        14

# Font size follows the window width (see auto_font.py to tune or remove).
watcher auto_font.py
window_padding_width 18
remember_window_size no
initial_window_width  95c
initial_window_height 28c

cursor_shape beam
cursor_blink_interval 0.5
mouse_hide_wait -1
scrollback_lines 5000

# Quality of life
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0
